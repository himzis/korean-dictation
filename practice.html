<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한국어 연습</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f0f12;color:#eee;display:flex;flex-direction:column;height:100dvh}
.top{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;color:#8b8b9a}
.prompt{flex:0 0 auto;padding:20px 16px;text-align:center;border-bottom:1px solid #2a2a32}
.dir{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8b8b9a}
.q{font-size:clamp(28px,8vw,40px);font-weight:700;margin:10px 0 6px}
.ans{font-size:18px;color:#aaa;min-height:24px}
.dots{margin-top:10px;font-size:22px;letter-spacing:6px}
.heard{flex:1;padding:16px;overflow-y:auto}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8b8b9a;margin-bottom:8px}
#heard{font-size:clamp(22px,6vw,30px);line-height:1.45;white-space:pre-wrap}
#heard.ok{color:#4caf50}#heard.bad{color:#ff7a6b}
#fb{font-size:18px;margin-top:10px;min-height:24px}
.bar{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#16161c;border-top:1px solid #2a2a32}
button{flex:1;font-size:16px;padding:15px 8px;border:0;border-radius:14px;color:#fff;background:#3a3a46}
#mic{background:#2b7cff;flex:1.4}#mic.on{background:#e53935}
.done{padding:40px 16px;text-align:center;font-size:24px}
</style></head><body>
<div class="top"><span id="prog"></span><span>3 correct to master</span></div>
<div class="prompt">
 <div class="dir" id="dir"></div>
 <div class="q" id="q">…</div>
 <div class="ans" id="ans"></div>
 <div class="dots" id="dots"></div>
</div>
<div class="heard"><div class="label">들린 말 · Heard</div><div id="heard"></div><div id="fb"></div></div>
<div class="bar">
 <button id="mic" type="button">🎤 시작</button>
 <button id="hint" type="button">힌트</button>
 <button id="listen" type="button">🔊</button>
 <button id="speed" type="button" style="flex:0 0 18%">1×</button>
 <button id="skip" type="button">다음 ›</button>
</div>
<script>
(function(){
const NEED=3;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let words=[],cur=null,dir='en',on=false,rec=null,fresh=true,mastered=0;
const TOPIC='wb-kr-ec5fdc28baeee3c6';let buf=[];const sid=Date.now().toString(36);
function logEv(o){o.t=new Date().toISOString();o.s=sid;buf.push(o);if(buf.length>=15)flush()}
function flush(){if(!buf.length)return;const b=JSON.stringify(buf);buf=[];
 try{fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:b,keepalive:true}).catch(()=>{})}catch(e){}}
setInterval(flush,30000);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',flush);
const norm=s=>s.replace(/[\s.,!?~·'"-]/g,'');
function pick(stay){
 const left=words.filter(w=>w.n<NEED);
 if(!left.length){cur=null;$('q').textContent='🎉';$('dir').textContent='';$('ans').textContent='All '+words.length+' mastered! 다 했어요!';$('dots').textContent='';$('prog').textContent=mastered+' / '+words.length;stop();return}
 if(!(stay&&cur&&cur.n<NEED)){
  let pool=left.length>1?left.filter(w=>w!==cur):left;
  let tot=pool.reduce((a,w)=>a+(w.bad?3:1),0),r=Math.random()*tot;
  for(const w of pool){r-=(w.bad?3:1);if(r<=0){cur=w;break}}
  if(!cur||cur.n>=NEED||!pool.includes(cur))cur=pool[pool.length-1];
 }
 dir=Math.random()<.5?'en':'ko';render();
}
function render(){
 $('prog').textContent=mastered+' / '+words.length+' mastered';
 $('dir').textContent=(dir==='en'?'Say it in Korean':'Read it aloud')+(cur.bad?' · ⚠︎ tricky':'');
 $('q').textContent=dir==='en'?cur.en:cur.ko;
 $('ans').textContent='';
 $('dots').textContent='●'.repeat(cur.n)+'○'.repeat(NEED-cur.n);
}
function check(t){
 if(!cur)return;
 const ok=norm(t).includes(norm(cur.ko));
 logEv({ev:'try',ko:cur.ko,dir:dir,heard:t,ok:ok});
 $('heard').className=ok?'ok':'bad';
 if(ok){cur.n++;
  if(cur.n>=NEED){logEv({ev:'mastered',ko:cur.ko});flush();mastered++;$('fb').textContent='✅ Mastered!';}
  else $('fb').textContent='✓ 좋아요! '+(NEED-cur.n)+' more';
  render();setTimeout(()=>pick(false),1100);return}
 cur.bad=true;
 $('fb').textContent=dir==='ko'?'✗ Try again':'✗ Try again: '+cur.ko+' ('+cur.rom+')';
 render();
}
function start(){
 rec=new SR();rec.lang='ko-KR';rec.continuous=false;rec.interimResults=true;fresh=true;
 rec.onresult=e=>{
  if(fresh){$('heard').textContent='';$('heard').className='';$('fb').textContent='';fresh=false}
  let t='',fin=false;for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}
  $('heard').textContent=t;
  if(fin)check(t);
 };
 rec.onerror=()=>{};
 rec.onend=()=>{if(on)setTimeout(()=>{if(on)try{start()}catch(e){}},150)};
 try{rec.start()}catch(e){}
}
function stop(){on=false;$('mic').classList.remove('on');$('mic').textContent='🎤 시작';if(rec)try{rec.stop()}catch(e){}}
$('mic').onclick=()=>{if(!SR){$('heard').textContent='Speech recognition not supported. Use Chrome or Safari.';return}
 if(on)stop();else{on=true;$('mic').classList.add('on');$('mic').textContent='■ 정지';start()}};
$('hint').onclick=()=>{if(cur){logEv({ev:'hint',ko:cur.ko});}if(cur){cur.bad=true;$('ans').textContent=cur.ko+' · '+cur.rom+' · '+cur.en}};
const RATES=[['1×',.9],['🐢 0.7×',.6],['🐢 0.5×',.4]];let ri=0;
$('speed').onclick=()=>{ri=(ri+1)%RATES.length;$('speed').textContent=RATES[ri][0];$('listen').click()};
$('listen').onclick=()=>{if(!cur||!window.speechSynthesis)return;const was=on;if(was)stop();
 const u=new SpeechSynthesisUtterance(cur.ko);u.lang='ko-KR';u.rate=RATES[ri][1];u.onend=()=>{if(was)$('mic').click()};speechSynthesis.cancel();speechSynthesis.speak(u)};
$('skip').onclick=()=>{if(cur)logEv({ev:'skip',ko:cur.ko});pick(false);$('heard').textContent='';$('fb').textContent=''};
fetch('vocab.json?'+Date.now()).then(r=>r.json()).then(d=>{words=d.words.filter(w=>w.current).slice(0,10).map(w=>Object.assign({},w,{n:0,bad:!!w.trouble}));pick(false)})
 .catch(()=>{$('q').textContent='단어를 불러올 수 없습니다.'});
})();
</script></body></html>
