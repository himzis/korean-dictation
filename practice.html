<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한국어 연습</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f0f12;color:#eee;display:flex;flex-direction:column;height:100dvh}
.top{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;color:#8b8b9a}
.prompt{flex:0 0 auto;padding:20px 16px;text-align:center;border-bottom:1px solid #2a2a32}
.dir{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8b8b9a}
.q{font-size:clamp(28px,8vw,40px);font-weight:700;margin:10px 0 6px}
.ans{font-size:18px;color:#aaa;min-height:24px}
.dots{margin-top:10px;font-size:22px;letter-spacing:6px}
.heard{flex:1;padding:16px;overflow-y:auto}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8b8b9a;margin-bottom:8px}
#heard{font-size:clamp(22px,6vw,30px);line-height:1.45;white-space:pre-wrap}
#heard.ok{color:#4caf50}#heard.bad{color:#ff7a6b}
#fb{font-size:18px;margin-top:10px;min-height:24px}
.bar{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#16161c;border-top:1px solid #2a2a32}
button{flex:1;font-size:16px;padding:15px 8px;border:0;border-radius:14px;color:#fff;background:#3a3a46}
#mic{background:#2b7cff;flex:1.4}#mic.on{background:#e53935}
.done{padding:40px 16px;text-align:center;font-size:24px}
</style></head><body>
<div class="top"><span id="prog"></span><span>3 in a row to master</span></div>
<div class="prompt">
 <div class="dir" id="dir"></div>
 <div class="q" id="q">…</div>
 <div class="ans" id="ans"></div>
 <div class="dots" id="dots"></div>
</div>
<div class="heard"><div class="label">들린 말 · Heard</div><div id="heard"></div><div id="fb"></div></div>
<div class="bar">
 <button id="mic" type="button">🎤 시작</button>
 <button id="hint" type="button">힌트</button>
 <button id="listen" type="button">🔊</button>
 <button id="skip" type="button">다음 ›</button>
</div>
<script>
(function(){
const NEED=3;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let words=[],queue=[],cur=null,streak=0,dir='en',on=false,rec=null,fresh=true,mastered=0;
const norm=s=>s.replace(/[\s.,!?~·'"-]/g,'');
function pick(){
 if(!queue.length){$('q').textContent='🎉';$('dir').textContent='';$('ans').textContent='All '+words.length+' mastered! 다 했어요!';$('dots').textContent='';$('prog').textContent=mastered+' / '+words.length;stop();return}
 cur=queue[0];streak=0;dir=Math.random()<.5?'en':'ko';render();
}
function render(){
 $('prog').textContent=mastered+' / '+words.length+' mastered';
 $('dir').textContent=dir==='en'?'Say it in Korean':'Read it aloud';
 $('q').textContent=dir==='en'?cur.en:cur.ko;
 $('ans').textContent=dir==='ko'?cur.rom+' · '+cur.en:'';
 $('dots').textContent='●'.repeat(streak)+'○'.repeat(NEED-streak);
}
function check(t){
 if(!cur)return;
 const ok=norm(t).includes(norm(cur.ko));
 $('heard').className=ok?'ok':'bad';
 if(ok){streak++;$('fb').textContent=streak>=NEED?'✅ Mastered!':'✓ 좋아요! '+(NEED-streak)+' more';
  if(streak>=NEED){mastered++;queue.shift();render();$('dots').textContent='●●●';setTimeout(pick,1300);return}
  dir=Math.random()<.5?'en':'ko';
 }else{streak=0;$('fb').textContent='✗ Try again: '+cur.ko+' ('+cur.rom+')';}
 render();
}
function start(){
 rec=new SR();rec.lang='ko-KR';rec.continuous=false;rec.interimResults=true;fresh=true;
 rec.onresult=e=>{
  if(fresh){$('heard').textContent='';$('heard').className='';$('fb').textContent='';fresh=false}
  let t='',fin=false;for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}
  $('heard').textContent=t;
  if(fin)check(t);
 };
 rec.onerror=()=>{};
 rec.onend=()=>{if(on)setTimeout(()=>{if(on)try{start()}catch(e){}},150)};
 try{rec.start()}catch(e){}
}
function stop(){on=false;$('mic').classList.remove('on');$('mic').textContent='🎤 시작';if(rec)try{rec.stop()}catch(e){}}
$('mic').onclick=()=>{if(!SR){$('heard').textContent='Speech recognition not supported. Use Chrome or Safari.';return}
 if(on)stop();else{on=true;$('mic').classList.add('on');$('mic').textContent='■ 정지';start()}};
$('hint').onclick=()=>{if(cur)$('ans').textContent=cur.ko+' · '+cur.rom+' · '+cur.en};
$('listen').onclick=()=>{if(!cur||!window.speechSynthesis)return;const was=on;if(was)stop();
 const u=new SpeechSynthesisUtterance(cur.ko);u.lang='ko-KR';u.rate=.85;u.onend=()=>{if(was)$('mic').click()};speechSynthesis.cancel();speechSynthesis.speak(u)};
$('skip').onclick=()=>{if(queue.length>1){queue.push(queue.shift())}pick();$('heard').textContent='';$('fb').textContent=''};
fetch('vocab.json?'+Date.now()).then(r=>r.json()).then(d=>{words=d.words.filter(w=>w.current).slice(0,10);queue=words.slice();pick()})
 .catch(()=>{$('q').textContent='단어를 불러올 수 없습니다.'});
})();
</script></body></html>
