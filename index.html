<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>한국어 받아쓰기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f0f12;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .panels {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-bottom: 1px solid #2a2a32;
  }
  .panel:last-of-type { border-bottom: 0; }
  .label {
    flex: 0 0 auto;
    padding: 10px 16px 4px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8b8b9a;
  }
  .text {
    flex: 1;
    padding: 8px 16px 16px;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.45;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .interim { color: #888; }
  .bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #16161c;
    border-top: 1px solid #2a2a32;
  }
  button {
    flex: 1;
    font-size: 18px;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    color: #fff;
    background: #2b7cff;
    -webkit-tap-highlight-color: transparent;
  }
  #mic.on { background: #e53935; }
  #clear { background: #3a3a46; flex: 0 0 30%; }
  .hint {
    padding: 0 16px 8px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }
.vocab{flex:0 0 auto;max-height:34%;overflow-y:auto;border-bottom:1px solid #2a2a32;padding:0 16px 10px}
.vw{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1e1e26;font-size:17px}
.vw .k{font-weight:600}.vw .r{color:#8b8b9a;font-size:13px}.vw .e{color:#bbb;text-align:right}
.vw.hit .k{color:#4caf50}
</style>
</head>
<body>
  <div class="panels">
<section class="vocab" aria-label="Vocabulary"><div class="label" style="padding-left:0">단어 · Vocabulary</div><div id="vlist"></div></section>
    <section class="panel" aria-label="Korean">
      <div class="label">한국어</div>
      <div class="text" id="koOut"><span id="koFinal"></span><span id="koInterim" class="interim"></span></div>
    </section>
    <section class="panel" aria-label="English">
      <div class="label">English</div>
      <div class="text" id="enOut"><span id="enFinal"></span><span id="enInterim" class="interim"></span></div>
    </section>
  </div>
  <div class="hint">Nothing is saved. Translation uses a free public API.</div>
  <div class="bar">
    <button id="mic" type="button">🎤 시작</button>
    <button id="clear" type="button">지우기</button>
  </div>
<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const koFinal = document.getElementById('koFinal');
  const koInterim = document.getElementById('koInterim');
  const enFinal = document.getElementById('enFinal');
  const enInterim = document.getElementById('enInterim');
  const koOut = document.getElementById('koOut');
  const enOut = document.getElementById('enOut');
  const mic = document.getElementById('mic');

  if (!SR) {
    koFinal.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Safari를 사용하세요.';
    mic.disabled = true;
    return;
  }

  let rec = null;
  let on = false;
  let translateSeq = 0;
  let pendingInterim = '';

  function scrollPanels() {
    koOut.scrollTop = koOut.scrollHeight;
    enOut.scrollTop = enOut.scrollHeight;
  }

  async function translate(text) {
    const q = text.trim();
    if (!q) return '';
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(q.slice(0, 450)) + '&langpair=ko|en';
    const res = await fetch(url);
    if (!res.ok) throw new Error('translate failed');
    const data = await res.json();
    return (data && data.responseData && data.responseData.translatedText) || '';
  }

  async function pushFinal(ko) {
    const piece = ko.trim();
    if (!piece) return;
    koFinal.textContent += (koFinal.textContent ? ' ' : '') + piece;
    const seq = ++translateSeq;
    enInterim.textContent = '…';
    try {
      const en = await translate(piece);
      if (seq !== translateSeq && !on) { /* still show */ }
      if (en) enFinal.textContent += (enFinal.textContent ? ' ' : '') + en;
    } catch (e) {
      enFinal.textContent += (enFinal.textContent ? ' ' : '') + '[translation unavailable]';
    }
    enInterim.textContent = '';
    scrollPanels();
  }

  let interimTimer = null;
  function scheduleInterimTranslate(ko) {
    pendingInterim = ko;
    clearTimeout(interimTimer);
    interimTimer = setTimeout(async () => {
      const text = pendingInterim.trim();
      if (!text) { enInterim.textContent = ''; return; }
      const seq = ++translateSeq;
      try {
        const en = await translate(text);
        if (seq === translateSeq) enInterim.textContent = en;
      } catch (e) {
        if (seq === translateSeq) enInterim.textContent = '';
      }
      scrollPanels();
    }, 450);
  }

  function start() {
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        const t = r[0].transcript;
        if (r.isFinal) {
          koInterim.textContent = '';
          enInterim.textContent = '';
          pushFinal(t);
        } else {
          interim += t;
        }
      }
      if (interim) {
        koInterim.textContent = interim;
        scheduleInterimTranslate(interim);
        scrollPanels();
      }
    };
    rec.onerror = () => {};
    rec.onend = () => { if (on) try { rec.start(); } catch (e) {} };
    rec.start();
  }

  mic.onclick = () => {
    on = !on;
    mic.classList.toggle('on', on);
    mic.textContent = on ? '■ 정지' : '🎤 시작';
    if (on) {
      start();
    } else if (rec) {
      try { rec.stop(); } catch (e) {}
      koInterim.textContent = '';
      enInterim.textContent = '';
      clearTimeout(interimTimer);
    }
  };

  document.getElementById('clear').onclick = () => {
    koFinal.textContent = '';
    koInterim.textContent = '';
    enFinal.textContent = '';
    enInterim.textContent = '';
    translateSeq++;
    clearTimeout(interimTimer);
  };
})();

(function(){fetch('vocab.json?'+Date.now()).then(r=>r.json()).then(d=>{
const cur=d.words.filter(w=>w.current).slice(0,10);
const L=document.getElementById('vlist');
cur.forEach(w=>{const el=document.createElement('div');el.className='vw';el.dataset.ko=w.ko.replace(/\s/g,'');
el.innerHTML='<div><div class="k"></div><div class="r"></div></div><div class="e"></div>';
el.querySelector('.k').textContent=w.ko;el.querySelector('.r').textContent=w.rom;el.querySelector('.e').textContent=w.en;L.appendChild(el)});
const ko=document.getElementById('koFinal');
new MutationObserver(()=>{const t=ko.textContent.replace(/\s/g,'');L.querySelectorAll('.vw').forEach(e=>e.classList.toggle('hit',t.includes(e.dataset.ko)))}).observe(ko,{childList:true,characterData:true,subtree:true});
}).catch(()=>{document.getElementById('vlist').textContent='단어를 불러올 수 없습니다.'})})();
</script>
</body>
</html>
